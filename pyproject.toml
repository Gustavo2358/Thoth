[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "thoth-learner"
version = "0.1.0"
description = "Auditable speaking evidence, deterministic learner state, and controlled evaluation"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "scipy>=1.14,<2", "httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
learner = "thoth.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
